<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cart | Food Express</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* ─────────── RESETS ─────────── */
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      background:#fffaf0;
      padding:40px 20px 140px;   /* extra bottom space for controls */
      color:#2a2a2a;
      min-height:100vh;
    }
    h1{
      font-size:2rem;
      margin-bottom:25px;
      text-align:center
    }

    

    /* ─────────── CART LIST ─────────── */
    .cart-item{
      display:flex;
      gap:18px;
      align-items:center;
      background:#fff;
      border-radius:12px;
      padding:18px;
      margin-bottom:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.06);
    }
    .cart-item img{
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:10px;
    }
    .info{flex:1}
    .info h4{font-size:1rem;font-weight:600;margin-bottom:5px}
    .info small{color:#777}
    .price{
      font-size:1.15rem;
      font-weight:700;
      color:#00a36c;
      margin-top:6px
    }
.qty-wrap input {
  width: 70px;
  padding: 7px 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  text-align: center;
  font-weight: 600;
  -moz-appearance: textfield;
}

.qty-wrap input::-webkit-outer-spin-button,
.qty-wrap input::-webkit-inner-spin-button {
  -webkit-appearance: inner-spin-button;
  opacity: 1;
}


    /* remove single */
    .remove-btn{
      background:#ffecec;
      border:none;
      color:#e02f2f;
      font-size:1.2rem;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      transition:background .2s;
    }
    .remove-btn:hover{background:#ffd1d1}

    /* ─────────── BOTTOM CONTROLS ─────────── */
    #controls{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      background:#fff;
      box-shadow:0 -4px 12px rgba(0,0,0,.08);
      padding:22px 25px;
      display:grid;
      grid-template-columns:1fr auto;   /* center buttons, total pushed right */
      align-items:center;
      z-index:100;
    }
    .buttons{
      display:flex;
      gap:18px;
      justify-content:center;
      width:100%;
    }
    .order-btn,
    .remove-all-btn{
      background:#00a36c;
      border:none;
      color:#fff;
      font-weight:600;
      padding:14px 26px;
      border-radius:12px;
      font-size:1rem;
      cursor:pointer;
      transition:opacity .2s;
    }
    .order-btn:hover,
    .remove-all-btn:hover{opacity:.9}
    .remove-all-btn{background:#e02f2f}

    .grand-total {
  font-size: 1.4rem;
  font-weight: 700;
  background: #fff4e6;
  color: #d35400;
  padding: 10px 18px;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  transition: background 0.2s;
}

.grand-total:hover {
  background: #ffe4cc;
}

    /* ─────────── TOAST ─────────── */
    .toast{
      position:fixed;
      bottom:110px;
      right:20px;
      z-index:999;
      background:#e0f7fa;
      color:#007b83;
      padding:12px 22px;
      font-weight:600;
      border-radius:10px;
      box-shadow:0 4px 12px rgba(0,0,0,.12);
      transition:opacity .5s ease
    }
.empty-msg {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 250px;
  font-size: 1.6rem;
  font-weight: 600;
  color: #d6336c;
  padding: 40px;
  text-align: center;
  max-width: 600px;
  margin: 40px auto 20px;
  font-family: 'Poppins', sans-serif;
}
  </style>
</head>
<body>
  <h1>🛒Your Cart</h1>
  <div id="cart-container"></div>

  <!-- Bottom controls -->
  <div id="controls">
    <div class="buttons">
      <button class="order-btn" id="order-all">Order All</button>
      <button class="remove-all-btn" id="remove-all">Remove All</button>
    </div>
    <span class="grand-total">Total: ₹<span id="grand-total">0</span></span>
  </div>

  <script>
    /************* TOAST *************/
    function toast(msg,bg='#e0f7fa',color='#007b83'){
      const t=document.createElement('div');
      t.className='toast';
      t.style.background=bg;
      t.style.color=color;
      t.textContent=msg;
      document.body.appendChild(t);
      setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),500)},2200);
    }

    /************* CART STATE *************/
    const cartContainer=document.getElementById('cart-container');
    const grandTotalEl=document.getElementById('grand-total');

    let cart=JSON.parse(localStorage.getItem('cart'))||[];
    cart=cart.map(it=>({...it,qty:it.qty??1}));

    function saveCart(){
      localStorage.setItem('cart',JSON.stringify(cart));
    }

    function updateGrandTotal(){
      const tot=cart.reduce((sum,it)=>sum+it.price*it.qty,0);
      grandTotalEl.textContent=tot;
    }

    /************* RENDER *************/
    function render(){
      cartContainer.innerHTML='';
      if(!cart.length){
       cartContainer.innerHTML = `
  <div class="empty-msg">
    <p>🛒 Your cart is empty.</p>
  </div>
`;


        updateGrandTotal();
        return;
      }

      cart.forEach((item,idx)=>{
        const row=document.createElement('div');
        row.className='cart-item';
        row.innerHTML=`
          <img src="${item.image}" alt="${item.name}">
          <div class="info">
            <h4>${item.name}</h4>
            <small>${item.desc}</small>
            <div class="price">₹${item.price}</div>
            <div class="qty-wrap">
              <label>Qty:</label>
              <input type="number" min="1" value="${item.qty}" data-idx="${idx}">
            </div>
          </div>
          <button class="remove-btn" data-idx="${idx}">✕</button>
        `;
        cartContainer.appendChild(row);
      });

      /* quantity change */
      cartContainer.querySelectorAll('input[type="number"]').forEach(input=>{
        input.addEventListener('change',e=>{
          const i=e.target.dataset.idx;
          const val=Math.max(1,parseInt(e.target.value||1,10));
          cart[i].qty=val;
          saveCart();
          updateGrandTotal();
        });
      });

      /* remove single item */
      cartContainer.querySelectorAll('.remove-btn').forEach(btn=>{
        btn.addEventListener('click',e=>{
          const i=e.target.dataset.idx;
          const removed=cart.splice(i,1)[0];
          saveCart();
          render();
          toast(`❌ Removed “${removed.name}”`,'#fff5f5','#d6336c');
        });
      });

      updateGrandTotal();
    }

    render();

    </script>
<script>
  document.getElementById('order-all').addEventListener('click', () => {
    const cartItems = JSON.parse(localStorage.getItem('cart') || '[]');

    if (cartItems.length === 0) {
      alert('🛒 Your cart is empty!');
      return;
    }

    // Save the cart to 'order' for order.html to use
    localStorage.setItem('order', JSON.stringify(cartItems));

    // 🔥 Clear the cart after saving it to 'order'
    localStorage.removeItem('cart');

    // Go to order page
    window.location.href = 'order.html';
  });

    /************* REMOVE ALL *************/
    document.getElementById('remove-all').addEventListener('click',()=>{
      if(!cart.length) return;
      cart=[];
      saveCart();
      render();
      toast('🗑️ All items removed','#fff5f5','#d6336c');
    });
  </script>
</body>
</html>
