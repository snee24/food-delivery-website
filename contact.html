<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Food Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #fffaf0;
    }

    header {
      background: linear-gradient(to right, #ff6f61, #ff9472);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 2rem;
      font-weight: 600;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h2 {
      color: #ff6f61;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      margin-top: 20px;
      background-color: #ff6f61;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #ff473a;
    }

    .info {
      margin-top: 30px;
      font-size: 0.95rem;
      color: #333;
    }

    .info p {
      margin: 8px 0;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #fbe8e5;
      margin-top: 40px;
      color: #555;
    }
  </style>
</head>
<body>

<header>
  Contact Us
</header>

<div class="container">
  <h2>We'd love to hear from you!</h2>
  <form>
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Your Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <button type="submit">Send Message</button>
  </form>

  <div class="info">
    <h3>Contact Info</h3>
    <p><strong>Phone:</strong> +91 98485xxxxx</p>
    <p><strong>Email:</strong> support@foodexpress.com</p>
    <p><strong>Address:</strong> Raipur, India</p>
  </div>
</div>

<footer>
  &copy; 2025 Food Express. All rights reserved.
</footer>

</body>
</html>
