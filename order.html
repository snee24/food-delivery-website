<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Place Your Order | Food Express</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #2a2a2a;
      padding: 20px;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 1.8rem;
      text-align: center;
      color: #e76f51;
    }
    .section {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    .section h3 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: #444;
    }
    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .item-left img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }
    .item-name {
      font-weight: 600;
      font-size: 1rem;
    }
    .qty-control {
      display: flex;
      align-items: center;
      margin-top: 4px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: #e9ecef;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 32px;
    }
    .qty {
      width: 26px;
      text-align: center;
      font-size: 0.95rem;
    }
    .item-price {
      min-width: 70px;
      text-align: right;
      font-size: 1rem;
      font-weight: 600;
      color: #444;
    }
    .total {
      text-align: right;
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 10px;
      color: #2d6a4f;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 12px 0 6px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #e76f51;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .3s;
    }
    .btn:hover {
      background: #d85b3f;
    }
    .empty-message {
      text-align: center;
      font-size: 1.1rem;
      color: #999;
      margin-top: 50px;
    }
    #success-popup {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .popup-box {
      text-align: center;
      padding: 40px 60px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
      animation: pop 0.4s ease-out;
    }
    .popup-box h2 {
      margin: 20px 0 10px;
      font-size: 28px;
      color: #333;
    }
    .popup-box p {
      margin-bottom: 25px;
      color: #555;
    }
    .popup-box button {
      padding: 10px 30px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #4BB543;
      color: #fff;
      cursor: pointer;
    }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <h2>Review & Place Your Order</h2>

  <div id="orderSummary" class="section">
    <h3>Your Items</h3>
    <div id="orderItems"></div>
    <div class="total">Total: ₹<span id="orderTotal">0</span></div>
  </div>

  <div class="section">
    <h3>Delivery Details</h3>

    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Your Name" required />

    <label for="contact">Contact Number</label>
    <input
      type="text"
      id="contact"
      placeholder="+91XXXXXXXXXX"
      maxlength="14"
      value="+91"
      required
      oninput="
        this.value = '+91' + 
                     this.value.replace(/[^0-9]/g, '')
                               .replace(/^91+/, '')
                               .slice(0, 10);
      "
    />

    <label for="address">Full Address</label>
    <input type="text" id="address" placeholder="Building / House / Flat / Floor No*" required />

    <label for="landmark">Landmark (Optional)</label>
    <input type="text" id="landmark" placeholder="Near Subway" />
  </div>

  <div class="section">
    <h3>Payment Method</h3>
    <select id="paymentMethod">
      <option value="COD">Cash on Delivery</option>
      <option value="UPI">UPI</option>
      <option value="Card">Credit / Debit Card</option>
    </select>
  </div>

  <button class="btn" onclick="placeOrder()">Place Order</button>

  <div id="success-popup">
    <div class="popup-box">
      <svg viewBox="0 0 24 24" width="80" height="80">
        <circle cx="12" cy="12" r="12" fill="#4BB543"/>
        <polyline points="6 13 10 17 18 7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>Order Placed!</h2>
      <p>Thank you for ordering with us.</p>
      <button onclick="window.location.href='dashboard.html'">Go to Dashboard</button>
<button onclick="window.location.href='menu.html'">Back to Menu</button>

    </div>
  </div>

  <div id="empty" class="empty-message" style="display:none;">🛒 Your order is empty!</div>

  <!-- Only showing the updated JavaScript part -->
<script>
  const orderItems = JSON.parse(localStorage.getItem("order") || "[]");
  const itemsContainer = document.getElementById("orderItems");
  const orderTotal = document.getElementById("orderTotal");
  const orderSummary = document.getElementById("orderSummary");
  const emptyMsg = document.getElementById("empty");

  function renderOrder() {
    if (orderItems.length === 0) {
      orderSummary.style.display = "none";
      emptyMsg.style.display = "block";
      return;
    }
    orderSummary.style.display = "block";
    emptyMsg.style.display = "none";
    itemsContainer.innerHTML = "";
    let total = 0;
    orderItems.forEach((item, idx) => {
      const qty = item.qty || 1;
      const itemTotal = item.price * qty;
      total += itemTotal;
      const row = document.createElement("div");
      row.className = "order-item";
      row.innerHTML = `
        <div class="item-left">
          <img src="${item.image || 'https://via.placeholder.com/60'}" alt="${item.name}">
          <div>
            <div class="item-name">${item.name}</div>
            <div class="qty-control">
              <button class="qty-btn" data-idx="${idx}" data-action="dec">−</button>
              <span class="qty" id="qty-${idx}">${qty}</span>
              <button class="qty-btn" data-idx="${idx}" data-action="inc">+</button>
            </div>
          </div>
        </div>
        <div class="item-price" id="price-${idx}">₹${itemTotal}</div>
      `;
      itemsContainer.appendChild(row);
    });
    orderTotal.textContent = total;
  }

  itemsContainer.addEventListener("click", e => {
    if (!e.target.classList.contains("qty-btn")) return;
    const idx = +e.target.dataset.idx;
    const action = e.target.dataset.action;
    const item = orderItems[idx];
    item.qty = item.qty || 1;
    if (action === "inc") {
      item.qty += 1;
    } else if (action === "dec" && item.qty > 1) {
      item.qty -= 1;
    }
    localStorage.setItem("order", JSON.stringify(orderItems));
    renderOrder();
  });

  function placeOrder() {
    const name = document.getElementById("name").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const address = document.getElementById("address").value.trim();
    const digits = contact.replace(/\D/g, "");

    if (!name || !contact || !address) {
      alert("Please fill out all required fields.");
      return;
    }

    if (digits.length !== 12 || !digits.startsWith("91")) {
      alert("Contact number must be valid and start with +91 followed by 10 digits.");
      return;
    }

    const orderData = {
      id: Date.now(),
      date: new Date().toLocaleString(),
      name: name,
      contact: contact,
      address: address,
      landmark: document.getElementById("landmark").value.trim(),
      items: orderItems,
      total: document.getElementById('orderTotal').textContent,
      status: "Placed"
    };

    const history = JSON.parse(localStorage.getItem('orderHistory') || '[]');
    history.unshift(orderData);
    localStorage.setItem('orderHistory', JSON.stringify(history));

    localStorage.removeItem('cart');
    localStorage.removeItem('order');

    document.getElementById('success-popup').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  renderOrder();
</script>
</body>
</html>
